# Tham chiếu khi chạy service trên Windows (lab / EasyCap)
# Copy đè config.yaml hoặc: python -m eos_service --config config.windows.yaml
host: 0.0.0.0
port: 8765
sim: false

platform:
  role: mast
  height_m: 12.0
  default_lat: 21.0285
  default_lon: 105.8542
  default_alt: 18.0
  default_heading: 0.0

cameras:
  visible:
    device: 1
    width: 1280
    height: 720
    fps: 15
    backend: dshow
  thermal:
    device: 2
    width: 640
    height: 512
    fps: 15
    backend: dshow
    colormap: false

visca:
  enabled: true
  port: COM27
  baud: 9600
  parity: none
  zoom_pulse_s: 0.35

satis:
  enabled: true
  port: COM25
  baud: 9600
  parity: even
  zoom_speed: 0.5
  fov_set_point: 0.10
  zoom_pulse_s: 0.35

laser:
  port: COM26
  baud: 57600
  protocol: lrf7047
  parity: even
  measure_cmd: LM,Md,3
  measure_interval_s: 0.8

ptz:
  protocol: pelco_d
  port: COM24
  baud: 2400
  address: 1
  pan_min: -180
  pan_max: 180
  tilt_min: -45
  tilt_max: 45
  pan_speed: 12.0
  tilt_speed: 8.0

gps:
  port: COM23
  baud: 9600

compass:
  source: gps
  port: COM22
  baud: 9600

ai:
  model: yolov8n.pt
  device: 0
  conf: 0.4
  imgsz: 640
  classes: [0, 1, 2, 3, 5, 7]
  use_ultralytics: true

optics:
  fov_h_1x: 60.0
  zoom_min: 1.0
  zoom_max: 30.0

record:
  dir: data/recordings
  fourcc: mp4v
