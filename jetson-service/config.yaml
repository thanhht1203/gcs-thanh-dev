# EO Control — Jetson Orin Nano 8GB (mặc định Linux)
# Đổi cổng UART/video trong GCS → Cấu hình → Serial / Camera, hoặc sửa file này.
host: 0.0.0.0
port: 8765
sim: false

platform:
  role: mast
  height_m: 12.0
  default_lat: 21.0285
  default_lon: 105.8542
  default_alt: 18.0
  default_heading: 0.0

cameras:
  visible:
    # FCB-EV9520L — HDMI/USB capture. MJPG neu select() timeout o /dev/video0
    device: /dev/video0
    width: 1920
    height: 1080
    fps: 60
    backend: v4l2
    fourcc: MJPG
  thermal:
    # SATIS analog — OpenCV V4L2
    device: /dev/video2
    width: 640
    height: 480
    fps: 30
    backend: v4l2
    colormap: false

# FCB: video OpenCV ; port VISCA UART
visca:
  protocol: visca
  video: /dev/video0   # hoac "none" neu chua cam FCB
  port: /dev/ttyUSB0
  baud: 9600
  parity: none
  address: 1
  zoom_pulse_s: 0.35

# SATIS: video OpenCV ; port RS422 zoom
satis:
  protocol: satis
  video: /dev/video2
  port: /dev/ttyUSB1
  baud: 9600
  parity: even
  zoom_speed: 0.5
  fov_set_point: 0.10
  zoom_pulse_s: 0.35

# LRF 7047
laser:
  port: /dev/ttyUSB2
  baud: 57600
  protocol: lrf7047
  parity: even
  measure_cmd: LM,Md,3
  measure_interval_s: 0.8

ptz:
  protocol: pelco_d
  port: /dev/ttyUSB3
  baud: 2400
  address: 1
  pan_min: -180
  pan_max: 180
  tilt_min: -45
  tilt_max: 45
  pan_speed: 12.0
  tilt_speed: 8.0

gps:
  port: /dev/ttyUSB4
  baud: 9600

compass:
  source: gps
  port: /dev/ttyUSB5
  baud: 9600

ai:
  model: yolov8n.pt
  device: 0
  conf: 0.4
  imgsz: 640
  classes: [0, 1, 2, 3, 5, 7]
  use_ultralytics: true

optics:
  fov_h_1x: 60.0
  zoom_min: 1.0
  zoom_max: 30.0

record:
  dir: data/recordings
  fourcc: mp4v
